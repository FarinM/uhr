[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
uhr-core = { path = "crates/uhr-core" }
addr2line = { version = "0.24", default-features = false, features = ["std", "rustc-demangle", "cpp_demangle"] }
anyhow = "1.0"
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-select = "60"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
linux-perf-data = "0.13"
memmap2 = "0.9"
lzma-rs = "0.3"
crc32fast = "1"
framehop = { version = "0.16", default-features = false, features = ["std"] }
gimli = { version = "0.31", default-features = false, features = ["read", "std", "endian-reader"] }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
rustix = { version = "1", features = ["pipe", "process", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stable_deref_trait = "1.2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wholesym = "0.8"
