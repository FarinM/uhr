[package]
name = "uhr-ebpf"
version.workspace = true
edition.workspace = true
publish.workspace = true
# Has to match the license string the kernel reads from the programs.
license = "MIT OR GPL-2.0-only"

[features]
# The aya traits that let uhr-linux read these types from the maps.
user = ["dep:aya"]

[dependencies]
aya = { workspace = true, optional = true }

[target.'cfg(target_arch = "bpf")'.dependencies]
aya-ebpf.workspace = true

[[bin]]
name = "uhr-ebpf"
path = "src/main.rs"

# Set by the build, as aya's are, to the architecture whose kernel runs the
# programs.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(bpf_target_arch, values("aarch64", "arm", "loongarch64", "mips", "mips64", "powerpc64", "riscv64", "s390x", "x86_64"))',
] }
